[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Persona Scan DB: https://hxapjyxzvmouwrhdgmsx.supabase.co (tables personascan_*)
# Netlify env: SUPABASE_URL, SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY, ADMIN_KEY,
# RESEND_API_KEY, EMAIL_FROM=Persona Scan <noreply@personascan.net>,
# SCAN_SITE_URL=https://secure.personascan.net (generated /scan links)
# Marketing site: personascan.net

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
